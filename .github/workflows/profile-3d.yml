name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fork of yoshi389111/github-profile-3d-contrib@v0.9.3, adding
      # LANG_SOURCE and COUNT_PRIVATE. The upstream pie and radar charts only
      # ever see public repositories, whatever token they are given.
      - uses: hide23ysmr/github-profile-3d-contrib@v0.9.3-private.1
        env:
          # A PAT with the `repo` scope. The default secrets.GITHUB_TOKEN may
          # only read this repository, so the charts below would come out
          # empty with it.
          GITHUB_TOKEN: ${{ secrets.PROFILE_3D_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # weigh pie chart languages by code size, private repositories included
          LANG_SOURCE: repository
          # count private contributions on the radar chart
          COUNT_PRIVATE: 'true'

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update 3d contribution graph"
            git push
          fi
